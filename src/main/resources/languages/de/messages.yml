# /stonertp blocktime - tägliche Zeiträume ohne Zufallsteleport.
blocktime:
  usage: "&c✖ Nutzung: &f/stonertp blocktime add <von> <bis>&c, &f/stonertp blocktime remove <nummer>&c oder &f/stonertp blocktime list&c."
  invalid: "&c✖ Ungültige Uhrzeit. Nutze HH:MM mit zwei verschiedenen Zeiten, z.B. &f/stonertp blocktime add 14:00 18:00&c."
  invalid-index: "&c✖ Es gibt keine Sperrzeit mit dieser Nummer - siehe &f/stonertp blocktime list&c."
  duplicate: "&c✖ &f{start} - {end} &cist bereits gesperrt."
  added: "&a✔ Zufallsteleport ist jetzt täglich von &f{start} &abis &f{end} Uhr &agesperrt."
  removed: "&a✔ Sperrzeit &f{start} - {end} &aentfernt."
  list-header: "&7Gesperrte Zufallsteleport-Zeiten &8(aktuelle Uhrzeit: &f{now} &8{timezone})&7:"
  list-entry: "  &8{index}. &f{start} - {end}{active}"
  list-empty: "  &7Keine - Zufallsteleport ist rund um die Uhr verfügbar."
  active-suffix: " &c(gerade aktiv)"

# /stonertp zone - Bereiche, die jeden darin Stehenden zufallsteleportieren.
zone:
  usage: "&c✖ Nutzung: &f/stonertp zone wand&c, &f/stonertp zone create <name> [sekunden]&c, &f/stonertp zone delete <name>&c oder &f/stonertp zone list&c."
  wand-name: "<gradient:#FFC24A:#FF7A00><bold>RTP-Zonen-Stab</bold></gradient>"
  wand-lore:
    - "&7Linksklick auf Block: &fEcke 1"
    - "&7Rechtsklick auf Block: &fEcke 2"
    - ""
    - "&8Danach: /stonertp zone create <name> [sekunden]"
  wand-given: "&a✔ Du hast den Zonen-Stab erhalten. &7Linksklick auf einen Block für Ecke 1, Rechtsklick für Ecke 2."
  pos-set: "&a✔ Ecke {pos} gesetzt auf &f{x}, {y}, {z} &7({world})&a."
  selection-size: "&7Auswahl: &f{x}×{y}×{z} &7Blöcke - jetzt &f/stonertp zone create <name> [sekunden] &7ausführen."
  no-selection: "&c✖ Markiere zuerst beide Ecken mit dem Zonen-Stab (&f/stonertp zone wand&c)."
  different-worlds: "&c✖ Beide Ecken müssen in derselben Welt liegen."
  invalid-name: "&c✖ Zonennamen dürfen nur Buchstaben, Zahlen, - und _ enthalten (max. 32 Zeichen)."
  name-taken: "&c✖ Eine Zone namens &f{name} &cexistiert bereits."
  invalid-interval: "&c✖ Das Intervall muss eine ganze Zahl an Sekunden sein (1 oder mehr)."
  created: "&a✔ RTP-Zone &f{name} &aerstellt &7({x}×{y}×{z} Blöcke, teleportiert nach {seconds}s)&a."
  world-not-enabled: "&e⚠ Zufallsteleport ist für &f{world} &ein der config.yml nicht aktiviert - die Zone bleibt inaktiv, bis er es ist."
  deleted: "&a✔ RTP-Zone &f{name} &agelöscht."
  not-found: "&c✖ Es gibt keine Zone namens &f{name}&c."
  list-header: "&7RTP-Zonen &8({count})&7:"
  list-entry: "  &8- &f{name} &7in &f{world} &8({min} → {max}, {seconds}s)"
  list-empty: "&7Noch keine RTP-Zonen - starte mit &f/stonertp zone wand&7."
  storage-broken: "&c✖ zones.yml enthält einen Syntaxfehler - behebe ihn und führe &f/stonertp reload &caus, bevor du Zonen änderst."
  # Actionbar-Texte, während man in einer Zone steht.
  countdown: "<gradient:#FFC24A:#FF7A00>➜ Zufallsteleport in {seconds}s...</gradient>"
  paused: "&c✖ Zufallsteleport pausiert bis &f{until} Uhr"
  left: "&7Du hast die RTP-Zone verlassen."

